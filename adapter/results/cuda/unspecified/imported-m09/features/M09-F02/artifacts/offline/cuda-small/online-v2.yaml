apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: m09-offline
  namespace: dynamo-m08-1029
  annotations:
    nvidia.com/workload-provider: component
    nvidia.com/enable-grove: 'false'
    nvidia.com/dynamo-discovery-backend: kubernetes
  labels:
    heyi.io/campaign: m09-offline-1030
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    runtimeVersionOverride: 1.5.1
    sharedMemorySize: 8Gi
    podTemplate:
      spec:
        nodeSelector:
          kubernetes.io/arch: amd64
          kubernetes.io/hostname: worker06
        containers:
        - name: main
          image: heyi/dynamo-vllm-cuda-runtime:1.5.1-m02
          imagePullPolicy: Never
          command:
          - /opt/dynamo/bin/entrypoint.sh
          args:
          - python
          - -m
          - dynamo.frontend
          - --router-mode
          - kv
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_ROUTER_USE_KV_EVENTS
            value: 'true'
          - name: DYN_PLATFORM
            value: cpu
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: GOMAXPROCS
            value: '4'
          - name: SPT_NOENV
            value: '1'
          - name: PYTHONPATH
            value: /m09-source/components/src
          - name: DYN_GRACEFUL_SHUTDOWN_GRACE_PERIOD_SECS
            value: '60'
          resources:
            requests:
              cpu: '1'
              memory: 2Gi
            limits:
              memory: 32Gi
              cpu: '8'
          volumeMounts:
          - name: models
            mountPath: /models/Qwen3-0.6B
            readOnly: true
          - name: m09-source
            mountPath: /m09-source
            readOnly: true
        volumes:
        - name: models
          hostPath:
            path: /ssd/models/dynamo-regression/Qwen3-0.6B
            type: Directory
        - name: m09-source
          hostPath:
            path: /home/bedicloud/CJ_workspace/m09-offline-1030/source
            type: Directory
        terminationGracePeriodSeconds: 120
  - name: VllmPrefillWorker
    type: prefill
    replicas: 1
    runtimeVersionOverride: 1.5.1
    sharedMemorySize: 8Gi
    podTemplate:
      spec:
        nodeSelector:
          kubernetes.io/arch: amd64
