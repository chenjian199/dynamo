apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: heyi-upgrade162-dynamo-operator-mutating
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/created-by: dynamo-operator
    app.kubernetes.io/part-of: dynamo-operator
    nvidia.com/dynamo-operator-namespace: heyi-upgrade162
    helm.sh/chart: dynamo-operator-1.6.2
    app.kubernetes.io/name: dynamo-operator
    app.kubernetes.io/instance: heyi-upgrade162
    app.kubernetes.io/version: "1.6.2"
    app.kubernetes.io/managed-by: Helm
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: heyi-upgrade162-dynamo-operator-webhook-service
      namespace: heyi-upgrade162
      path: /mutate/nvidia.com/v1beta1/dynamographdeployments
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: mdynamographdeployment.kb.io
  rules:
  - apiGroups:
    - nvidia.com
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - dynamographdeployments
  sideEffects: None
  timeoutSeconds: 10
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: heyi-upgrade162-dynamo-operator-webhook-service
      namespace: heyi-upgrade162
      path: /mutate-nvidia-com-v1beta1-dynamocomponentdeployment
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: mdynamocomponentdeploymentv1beta1.kb.io
  rules:
  - apiGroups:
    - nvidia.com
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - dynamocomponentdeployments
  sideEffects: None
  timeoutSeconds: 10
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: heyi-upgrade162-dynamo-operator-webhook-service
      namespace: heyi-upgrade162
      path: /mutate-nvidia-com-v1beta1-dynamographdeploymentrequest
  failurePolicy: Fail
  name: mdynamographdeploymentrequestv1beta1.kb.io
  rules:
  - apiGroups:
    - nvidia.com
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - dynamographdeploymentrequests
  sideEffects: None
  timeoutSeconds: 10
- admissionReviewVersions:
