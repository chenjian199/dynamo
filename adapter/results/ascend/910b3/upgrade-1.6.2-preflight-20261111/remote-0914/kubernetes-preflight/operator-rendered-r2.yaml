apiVersion: v1
kind: ConfigMap
metadata:
  name: heyi-upgrade162-dynamo-operator-config
  labels:
    helm.sh/chart: dynamo-operator-1.6.2
    app.kubernetes.io/name: dynamo-operator
    app.kubernetes.io/instance: heyi-upgrade162
    app.kubernetes.io/version: "1.6.2"
    app.kubernetes.io/managed-by: Helm
data:
  config.yaml: |
    apiVersion: operator.config.dynamo.nvidia.com/v1alpha1
    kind: OperatorConfiguration
    server:
      metrics:
        bindAddress: "0.0.0.0"
        secure: true
      webhook:
        certProvisionMode: "auto"
        secretName: "webhook-server-cert"
        serviceName: heyi-upgrade162-dynamo-operator-webhook-service
    leaderElection:
      enabled: true
      id: "dynamo.nvidia.com"
      namespace: "kube-system"
    orchestrators:
      kaiScheduler:
        enabled: false
      volcanoScheduler:
        enabled: false
      grove:
        enabled: false
        terminationDelay: "4h"
    serviceMesh:
      enabled: false
    rbac:
      plannerClusterRoleName: heyi-upgrade162-dynamo-operator-planner
      dgdrProfilingClusterRoleName: heyi-upgrade162-dynamo-operator-dgdr-profiling
      eppClusterRoleName: heyi-upgrade162-dynamo-operator-epp
    mpi:
      sshSecretName: "mpi-run-ssh-secret"
      sshSecretNamespace: "heyi-upgrade162"
    lpx:
      enabled: false
---
