# Source: dynamo-operator/templates/gpu-discovery-rbac.yaml
# Grants the operator read-only node access for GPU hardware discovery.
# Nodes are cluster-scoped resources that cannot be granted via a namespace-scoped Role,
# so they are always provided as a dedicated ClusterRole when GPU discovery is enabled.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: heyi-upgrade162-dynamo-operator-heyi-upgrade162-gpu-discovery
  labels:
    helm.sh/chart: dynamo-operator-1.6.2
    app.kubernetes.io/name: dynamo-operator
    app.kubernetes.io/instance: heyi-upgrade162
    app.kubernetes.io/version: "1.6.2"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
