apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: m10-offline
  namespace: heyi-upgrade162
  annotations:
    nvidia.com/workload-provider: component
    nvidia.com/enable-grove: 'false'
    nvidia.com/dynamo-discovery-backend: kubernetes
  labels:
    heyi.io/campaign: heyi-upgrade162
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    runtimeVersionOverride: 1.6.2
    sharedMemorySize: 8Gi
    podTemplate:
      spec:
        nodeSelector:
          kubernetes.io/arch: arm64
          kubernetes.io/hostname: master-02-45d4a763
        containers:
        - name: main
          image: heyi/dynamo:1.6.2-ascend0.30-49ef509336-runtime
          imagePullPolicy: Never
          command:
          - /opt/dynamo/bin/entrypoint.sh
          args:
          - python
          - -m
          - dynamo.frontend
          - --router-mode
          - kv
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_ROUTER_USE_KV_EVENTS
            value: 'true'
          - name: DYN_PLATFORM
            value: cpu
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: GOMAXPROCS
            value: '4'
          - name: SPT_NOENV
            value: '1'
          - name: DYN_GRACEFUL_SHUTDOWN_GRACE_PERIOD_SECS
            value: '60'
          resources:
            requests:
              cpu: '1'
              memory: 2Gi
            limits:
              memory: 32Gi
              cpu: '8'
          volumeMounts:
          - name: models
            mountPath: /models/Qwen3-0.6B
            readOnly: true
        volumes:
        - name: models
          hostPath:
            path: /data/weight/Qwen3-0.6B
            type: Directory
        terminationGracePeriodSeconds: 120
  - name: VllmPrefillWorker
    type: prefill
    replicas: 1
    runtimeVersionOverride: 1.6.2
    sharedMemorySize: 8Gi
    podTemplate:
      spec:
        nodeSelector:
          kubernetes.io/arch: arm64
          kubernetes.io/hostname: master-02-45d4a763
        containers:
        - name: main
          image: heyi/dynamo:1.6.2-ascend0.30-49ef509336-runtime
          imagePullPolicy: Never
          command:
          - /opt/dynamo/bin/entrypoint.sh
          args:
          - python
          - -m
          - dynamo.vllm
          - --model
          - /models/Qwen3-0.6B
          - --served-model-name
