          - name: DYN_ROUTER_USE_KV_EVENTS
            value: 'true'
          - name: DYN_PLATFORM
            value: cpu
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: GOMAXPROCS
            value: '4'
          - name: SPT_NOENV
            value: '1'
          - name: DYN_GRACEFUL_SHUTDOWN_GRACE_PERIOD_SECS
