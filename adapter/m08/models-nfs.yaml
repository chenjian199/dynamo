# Example only: change server/path/namespace for the destination cluster.
# Do not apply if the target namespace already has a suitable models PVC.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dynamo-m08-models-nfs
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - ro
  nfs:
    server: 192.168.10.62
    path: /data/HY/NFS
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: dynamo-system
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: dynamo-m08-models-nfs
  resources:
    requests:
      storage: 100Gi
