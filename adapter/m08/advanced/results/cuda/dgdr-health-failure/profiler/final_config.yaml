apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: vllm-disagg-b069825b
  annotations:
    nvidia.com/dynamo-discovery-backend: kubernetes
    nvidia.com/enable-grove: 'false'
    nvidia.com/workload-provider: component
  labels:
    heyi.io/campaign: dynamo-m08-1029
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: heyi/dynamo-vllm-cuda-runtime:1.5.1-m02
          workingDir: /tmp
          command:
          - /opt/dynamo/bin/entrypoint.sh
          - python3
          args:
          - -m
          - dynamo.frontend
          - --model-name
          - /models/Qwen3-0.6B
          - --model-path
          - /models/Qwen3-0.6B
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_ROUTER_USE_KV_EVENTS
            value: 'true'
          - name: DYN_PLATFORM
            value: cpu
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: GOMAXPROCS
            value: '4'
          - name: SPT_NOENV
            value: '1'
          volumeMounts:
          - mountPath: /models/Qwen3-0.6B
            name: models
            readOnly: true
          envFrom:
          - secretRef:
              name: hf-token-secret
              optional: true
          imagePullPolicy: Never
        volumes:
        - hostPath:
            path: /ssd/models/dynamo-regression/Qwen3-0.6B
            type: Directory
          name: models
        nodeSelector:
          kubernetes.io/arch: amd64
          kubernetes.io/hostname: worker06
    runtimeVersionOverride: 1.5.1
    sharedMemorySize: 8Gi
  - name: VllmDecodeWorker
    type: worker
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: heyi/dynamo-vllm-cuda-runtime:1.5.1-m02
          workingDir: /tmp
          command:
          - /opt/dynamo/bin/entrypoint.sh
          - python3
          - -m
          - dynamo.vllm
          args:
          - --tensor-parallel-size
          - '1'
          - --pipeline-parallel-size
          - '1'
          - --data-parallel-size
          - '1'
          - --max-num-seqs
          - '512'
          - --max-num-batched-tokens
          - '512'
          - --disaggregation-mode
          - decode
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          - --model
          - /models/Qwen3-0.6B
          - --served-model-name
          - /models/Qwen3-0.6B
          - --enforce-eager
          - --gpu-memory-utilization
          - '0.3'
          - --disable-custom-all-reduce
          - --block-size
          - '128'
          - --max-model-len
          - '1024'
          resources:
            limits:
              nvidia.com/gpu: '1'
            requests:
              ephemeral-storage: 2Gi
              nvidia.com/gpu: '1'
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_ROUTER_USE_KV_EVENTS
            value: 'true'
          - name: DYN_PLATFORM
            value: cuda
          - name: VLLM_HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
            value: '20090'
          - name: VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT
            value: '60'
          - name: ASCEND_TRANSFER_TIMEOUT
            value: '30000'
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: GOMAXPROCS
            value: '4'
          - name: SPT_NOENV
            value: '1'
          - name: UCX_TLS
            value: tcp,sm,self,cuda_copy,cuda_ipc
          volumeMounts:
          - mountPath: /models/Qwen3-0.6B
            name: models
            readOnly: true
          - mountPath: /opt/dynamo/venv/lib/python3.12/site-packages/dynamo/common/platform/preflight.py
            name: preflight-source
            readOnly: true
            subPath: preflight.py
          envFrom:
          - secretRef:
              name: hf-token-secret
              optional: true
          imagePullPolicy: Never
        volumes:
        - hostPath:
            path: /ssd/models/dynamo-regression/Qwen3-0.6B
            type: Directory
          name: models
        - configMap:
            name: m08-preflight-source
          name: preflight-source
        nodeSelector:
          kubernetes.io/arch: amd64
          kubernetes.io/hostname: worker06
        runtimeClassName: nvidia
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
    runtimeVersionOverride: 1.5.1
    sharedMemorySize: 8Gi
  - name: VllmPrefillWorker
    type: worker
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: heyi/dynamo-vllm-cuda-runtime:1.5.1-m02
          workingDir: /tmp
          command:
          - /opt/dynamo/bin/entrypoint.sh
          - python3
          - -m
          - dynamo.vllm
          args:
          - --tensor-parallel-size
          - '1'
          - --pipeline-parallel-size
          - '1'
          - --data-parallel-size
          - '1'
          - --max-num-seqs
          - '1'
          - --max-num-batched-tokens
          - '1628'
          - --disaggregation-mode
          - prefill
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          - --model
          - /models/Qwen3-0.6B
          - --served-model-name
          - /models/Qwen3-0.6B
          - --enforce-eager
          - --gpu-memory-utilization
          - '0.3'
          - --disable-custom-all-reduce
          - --block-size
          - '128'
          - --max-model-len
          - '1024'
          resources:
            limits:
              nvidia.com/gpu: '1'
            requests:
              ephemeral-storage: 2Gi
              nvidia.com/gpu: '1'
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_ROUTER_USE_KV_EVENTS
            value: 'true'
          - name: DYN_PLATFORM
            value: cuda
          - name: VLLM_HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
            value: '20090'
          - name: VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT
            value: '60'
          - name: ASCEND_TRANSFER_TIMEOUT
            value: '30000'
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: GOMAXPROCS
            value: '4'
          - name: SPT_NOENV
            value: '1'
          - name: UCX_TLS
            value: tcp,sm,self,cuda_copy,cuda_ipc
          volumeMounts:
          - mountPath: /models/Qwen3-0.6B
            name: models
            readOnly: true
          - mountPath: /opt/dynamo/venv/lib/python3.12/site-packages/dynamo/common/platform/preflight.py
            name: preflight-source
            readOnly: true
            subPath: preflight.py
          envFrom:
          - secretRef:
              name: hf-token-secret
              optional: true
          imagePullPolicy: Never
        volumes:
        - hostPath:
            path: /ssd/models/dynamo-regression/Qwen3-0.6B
            type: Directory
          name: models
        - configMap:
            name: m08-preflight-source
          name: preflight-source
        nodeSelector:
          kubernetes.io/arch: amd64
          kubernetes.io/hostname: worker06
        runtimeClassName: nvidia
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
    runtimeVersionOverride: 1.5.1
    sharedMemorySize: 8Gi
  backendFramework: vllm
