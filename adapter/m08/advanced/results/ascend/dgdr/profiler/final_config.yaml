apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: vllm-disagg-702ba843
  annotations:
    nvidia.com/dynamo-discovery-backend: kubernetes
    nvidia.com/enable-grove: 'false'
    nvidia.com/workload-provider: component
  labels:
    heyi.io/campaign: dynamo-m08-1029
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: heyi/dynamo-vllm-ascend-runtime:1.5.1-m02
          workingDir: /tmp
          command:
          - /opt/dynamo/bin/entrypoint.sh
          - python3
          args:
          - -m
          - dynamo.frontend
          - --model-name
          - /models/Qwen3-0.6B
          - --model-path
          - /models/Qwen3-0.6B
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_ROUTER_USE_KV_EVENTS
            value: 'true'
          - name: DYN_PLATFORM
            value: cpu
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: GOMAXPROCS
            value: '4'
          - name: SPT_NOENV
            value: '1'
          volumeMounts:
          - mountPath: /models/Qwen3-0.6B
            name: models
            readOnly: true
          envFrom:
          - secretRef:
              name: hf-token-secret
              optional: true
          imagePullPolicy: Never
        volumes:
        - hostPath:
            path: /data/weight/Qwen3-0.6B
            type: Directory
          name: models
        nodeSelector:
          kubernetes.io/arch: arm64
          kubernetes.io/hostname: master-02-45d4a763
    runtimeVersionOverride: 1.5.1
    sharedMemorySize: 8Gi
  - name: VllmDecodeWorker
    type: worker
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: heyi/dynamo-vllm-ascend-runtime:1.5.1-m02
          workingDir: /tmp
          command:
          - /opt/dynamo/bin/entrypoint.sh
          - python3
          - -m
          - dynamo.vllm
          args:
          - --tensor-parallel-size
          - '1'
          - --pipeline-parallel-size
          - '1'
          - --data-parallel-size
          - '1'
          - --max-num-seqs
          - '512'
          - --max-num-batched-tokens
          - '512'
          - --disaggregation-mode
          - decode
          - --model
          - /models/Qwen3-0.6B
          - --served-model-name
          - /models/Qwen3-0.6B
          - --kv-transfer-config
          - '{"kv_connector": "MooncakeConnector", "kv_connector_module_path": "vllm_ascend.distributed.kv_transfer.kv_p2p.mooncake_connector",
            "kv_role": "kv_consumer", "kv_connector_extra_config": {"decode": {"tp_size":
            1, "dp_size": 1, "pp_size": 1}, "prefill": {"tp_size": 1, "dp_size": 1,
            "pp_size": 1}}}'
          - --enforce-eager
          - --gpu-memory-utilization
          - '0.3'
          - --disable-custom-all-reduce
          - --block-size
          - '128'
          - --max-model-len
          - '1024'
          resources:
            limits:
              huawei.com/Ascend910: '1'
            requests:
              ephemeral-storage: 2Gi
              huawei.com/Ascend910: '1'
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_ROUTER_USE_KV_EVENTS
            value: 'true'
          - name: DYN_PLATFORM
            value: ascend
          - name: VLLM_HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
            value: '20090'
          - name: VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT
            value: '60'
          - name: ASCEND_TRANSFER_TIMEOUT
            value: '30000'
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: GOMAXPROCS
            value: '4'
          - name: SPT_NOENV
            value: '1'
          - name: DYN_HEALTH_CHECK_PAYLOAD
            value: '{"token_ids": [1], "sampling_options": {"temperature": 0.0}, "stop_conditions":
              {"max_tokens": 1}, "annotations": ["x-bypass-remote-prefill"]}'
          volumeMounts:
          - mountPath: /models/Qwen3-0.6B
            name: models
            readOnly: true
          - mountPath: /usr/local/Ascend/driver
            name: ascend-driver
            readOnly: true
          - mountPath: /usr/local/dcmi
            name: ascend-dcmi
            readOnly: true
          - mountPath: /usr/local/sbin/npu-smi
            name: ascend-smi
            readOnly: true
          envFrom:
          - secretRef:
              name: hf-token-secret
              optional: true
          imagePullPolicy: Never
        volumes:
        - hostPath:
            path: /data/weight/Qwen3-0.6B
            type: Directory
          name: models
        - hostPath:
            path: /usr/local/Ascend/driver
            type: Directory
          name: ascend-driver
        - hostPath:
            path: /usr/local/dcmi
            type: Directory
          name: ascend-dcmi
        - hostPath:
            path: /usr/local/bin/npu-smi
            type: File
          name: ascend-smi
        nodeSelector:
          kubernetes.io/arch: arm64
          kubernetes.io/hostname: master-02-45d4a763
        tolerations:
        - effect: NoSchedule
          key: huawei.com/Ascend910
          operator: Exists
    runtimeVersionOverride: 1.5.1
    sharedMemorySize: 8Gi
  - name: VllmPrefillWorker
    type: worker
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: heyi/dynamo-vllm-ascend-runtime:1.5.1-m02
          workingDir: /tmp
          command:
          - /opt/dynamo/bin/entrypoint.sh
          - python3
          - -m
          - dynamo.vllm
          args:
          - --tensor-parallel-size
          - '1'
          - --pipeline-parallel-size
          - '1'
          - --data-parallel-size
          - '1'
          - --max-num-seqs
          - '1'
          - --max-num-batched-tokens
          - '1628'
          - --disaggregation-mode
          - prefill
          - --model
          - /models/Qwen3-0.6B
          - --served-model-name
          - /models/Qwen3-0.6B
          - --kv-transfer-config
          - '{"kv_connector": "MooncakeConnector", "kv_connector_module_path": "vllm_ascend.distributed.kv_transfer.kv_p2p.mooncake_connector",
            "kv_role": "kv_producer", "kv_connector_extra_config": {"decode": {"tp_size":
            1, "dp_size": 1, "pp_size": 1}, "prefill": {"tp_size": 1, "dp_size": 1,
            "pp_size": 1}}}'
          - --enforce-eager
          - --gpu-memory-utilization
          - '0.3'
          - --disable-custom-all-reduce
          - --block-size
          - '128'
          - --max-model-len
          - '1024'
          resources:
            limits:
              huawei.com/Ascend910: '1'
            requests:
              ephemeral-storage: 2Gi
              huawei.com/Ascend910: '1'
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_ROUTER_USE_KV_EVENTS
            value: 'true'
          - name: DYN_PLATFORM
            value: ascend
          - name: VLLM_HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
            value: '20090'
          - name: VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT
            value: '60'
          - name: ASCEND_TRANSFER_TIMEOUT
            value: '30000'
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: GOMAXPROCS
            value: '4'
          - name: SPT_NOENV
            value: '1'
          volumeMounts:
          - mountPath: /models/Qwen3-0.6B
            name: models
            readOnly: true
          - mountPath: /usr/local/Ascend/driver
            name: ascend-driver
            readOnly: true
          - mountPath: /usr/local/dcmi
            name: ascend-dcmi
            readOnly: true
          - mountPath: /usr/local/sbin/npu-smi
            name: ascend-smi
            readOnly: true
          envFrom:
          - secretRef:
              name: hf-token-secret
              optional: true
          imagePullPolicy: Never
        volumes:
        - hostPath:
            path: /data/weight/Qwen3-0.6B
            type: Directory
          name: models
        - hostPath:
            path: /usr/local/Ascend/driver
            type: Directory
          name: ascend-driver
        - hostPath:
            path: /usr/local/dcmi
            type: Directory
          name: ascend-dcmi
        - hostPath:
            path: /usr/local/bin/npu-smi
            type: File
          name: ascend-smi
        nodeSelector:
          kubernetes.io/arch: arm64
          kubernetes.io/hostname: master-02-45d4a763
        tolerations:
        - effect: NoSchedule
          key: huawei.com/Ascend910
          operator: Exists
    runtimeVersionOverride: 1.5.1
    sharedMemorySize: 8Gi
  backendFramework: vllm
