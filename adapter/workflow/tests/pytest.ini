[pytest]
addopts = --strict-markers
markers =
    unit: CPU-only workflow contract test
    gpu_0: CPU-only tests classified by the upstream root collection hook
    pre_merge: Upstream lifecycle marker
    defaulted: Upstream default classification for otherwise unmarked tests
