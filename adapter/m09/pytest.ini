[pytest]
asyncio_mode = auto
addopts = --strict-markers
markers =
    unit: unit tests
    gpu_0: no GPU required
    pre_merge: pre-merge tests
    planner: Planner tests
    asyncio: asynchronous tests
    vllm: vLLM backend tests
    core: core tests
    profiled_vram_gib: measured model memory requirement
    timeout: bounded test duration
    xpu_1: requires one XPU (not selected by M09 CPU suite)
    parallel: CPU tests safe for parallel execution
