          imagePullPolicy: Never
          command:
          - /opt/dynamo/bin/entrypoint.sh
          args:
          - python
          - -m
          - dynamo.frontend
          - --router-mode
          - round-robin
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_ROUTER_USE_KV_EVENTS
            value: 'true'
          - name: DYN_PLATFORM
            value: cpu
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: GOMAXPROCS
            value: '4'
          - name: SPT_NOENV
            value: '1'
          - name: PYTHONPATH
            value: /m09-source/components/src
          resources:
            requests:
              cpu: '1'
              memory: 2Gi
            limits:
              memory: 32Gi
              cpu: '8'
          volumeMounts:
          - name: models
            mountPath: /models/current
            readOnly: true
          - name: m09-source
            mountPath: /m09-source
            readOnly: true
        volumes:
        - name: models
          hostPath:
            path: /ssd/wtaobj/models/DeepSeek-V4-Flash-0731
