apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: m09-offline-qwen32
  namespace: dynamo-m08-1029
  annotations:
    nvidia.com/workload-provider: component
    nvidia.com/enable-grove: 'false'
    nvidia.com/dynamo-discovery-backend: kubernetes
  labels:
    heyi.io/campaign: m09-offline-1030
spec:
  backendFramework: vllm
  components:
  - name: frontend
    type: frontend
    replicas: 1
    runtimeVersionOverride: 1.5.1
    sharedMemorySize: 8Gi
    podTemplate:
      spec:
        nodeSelector:
          kubernetes.io/arch: amd64
          kubernetes.io/hostname: worker06
        containers:
        - name: main
          image: heyi/dynamo-vllm-cuda-runtime:1.5.1-m02
          imagePullPolicy: Never
          command:
          - /opt/dynamo/bin/entrypoint.sh
          args:
          - python
          - -m
          - dynamo.frontend
          - --router-mode
          - round-robin
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_ROUTER_USE_KV_EVENTS
            value: 'true'
          - name: DYN_PLATFORM
            value: cpu
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: GOMAXPROCS
            value: '4'
          - name: SPT_NOENV
            value: '1'
          - name: PYTHONPATH
            value: /m09-source/components/src
          resources:
            requests:
              cpu: '1'
              memory: 2Gi
            limits:
              memory: 32Gi
              cpu: '8'
          volumeMounts:
          - name: models
            mountPath: /models/current
            readOnly: true
          - name: m09-source
            mountPath: /m09-source
            readOnly: true
        volumes:
        - name: models
          hostPath:
            path: /ssd/models/dynamo-regression/Qwen3-32B
            type: Directory
        - name: m09-source
          hostPath:
            path: /home/bedicloud/CJ_workspace/m09-offline-qwen32-1030/source
            type: Directory
  - name: VllmPrefillWorker
    type: prefill
    replicas: 1
    runtimeVersionOverride: 1.5.1
    sharedMemorySize: 16Gi
    podTemplate:
      spec:
        nodeSelector:
          kubernetes.io/arch: amd64
          kubernetes.io/hostname: worker28
        containers:
        - name: main
          image: heyi/dynamo-vllm-cuda-runtime:1.5.1-m02
          imagePullPolicy: Never
          command:
          - /opt/dynamo/bin/entrypoint.sh
          args:
          - python
          - -m
          - dynamo.vllm
          - --model
          - /models/current
          - --served-model-name
          - m09-model
          - --enforce-eager
          - --tensor-parallel-size
          - '4'
          - --max-model-len
          - '4096'
          - --max-num-seqs
          - '16'
          - --gpu-memory-utilization
          - '0.9'
          - --block-size
          - '128'
          - --disable-custom-all-reduce
          - --kv-cache-memory-bytes
          - '536870912'
          - --no-enable-prefix-caching
          - --disaggregation-mode
          - prefill
          - --kv-transfer-config
          - '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_ROUTER_USE_KV_EVENTS
            value: 'true'
          - name: DYN_PLATFORM
            value: cuda
          - name: VLLM_HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
            value: '20090'
          - name: VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT
            value: '60'
          - name: ASCEND_TRANSFER_TIMEOUT
            value: '30000'
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: GOMAXPROCS
            value: '4'
          - name: SPT_NOENV
            value: '1'
          - name: UCX_TLS
            value: tcp,sm,self,cuda_copy,cuda_ipc
          - name: DYN_GRACEFUL_SHUTDOWN_GRACE_PERIOD_SECS
            value: '180'
          - name: PYTHONPATH
            value: /m09-source/components/src
          resources:
            requests:
              nvidia.com/gpu: 4
              cpu: '8'
              memory: 64Gi
            limits:
              nvidia.com/gpu: 4
              cpu: '32'
              memory: 256Gi
          volumeMounts:
          - name: models
            mountPath: /models/current
            readOnly: true
          - name: m09-source
            mountPath: /m09-source
            readOnly: true
        volumes:
        - name: models
          hostPath:
            path: /root/Qwen3-32B
            type: Directory
        - name: m09-source
          hostPath:
            path: /home/bedicloud/CJ_workspace/m09-offline-qwen32-1030/source
            type: Directory
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        runtimeClassName: nvidia
        terminationGracePeriodSeconds: 240
  - name: VllmDecodeWorker
    type: decode
    replicas: 1
    runtimeVersionOverride: 1.5.1
    sharedMemorySize: 16Gi
    podTemplate:
      spec:
        nodeSelector:
          kubernetes.io/arch: amd64
          kubernetes.io/hostname: worker28
        containers:
        - name: main
          image: heyi/dynamo-vllm-cuda-runtime:1.5.1-m02
          imagePullPolicy: Never
          command:
          - /opt/dynamo/bin/entrypoint.sh
          args:
          - python
          - -m
          - dynamo.vllm
          - --model
          - /models/current
          - --served-model-name
          - m09-model
          - --enforce-eager
          - --tensor-parallel-size
          - '4'
          - --max-model-len
          - '4096'
          - --max-num-seqs
          - '16'
          - --gpu-memory-utilization
          - '0.9'
          - --block-size
          - '128'
          - --disable-custom-all-reduce
          - --kv-cache-memory-bytes
          - '536870912'
          - --no-enable-prefix-caching
          - --disaggregation-mode
          - decode
          - --kv-transfer-config
          - '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_ROUTER_USE_KV_EVENTS
            value: 'true'
          - name: DYN_PLATFORM
            value: cuda
          - name: VLLM_HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
            value: '20090'
          - name: VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT
            value: '60'
          - name: ASCEND_TRANSFER_TIMEOUT
            value: '30000'
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: GOMAXPROCS
            value: '4'
          - name: SPT_NOENV
            value: '1'
          - name: UCX_TLS
            value: tcp,sm,self,cuda_copy,cuda_ipc
          - name: DYN_GRACEFUL_SHUTDOWN_GRACE_PERIOD_SECS
            value: '180'
          - name: PYTHONPATH
            value: /m09-source/components/src
          resources:
            requests:
              nvidia.com/gpu: 4
              cpu: '8'
              memory: 64Gi
            limits:
              nvidia.com/gpu: 4
              cpu: '32'
              memory: 256Gi
          volumeMounts:
          - name: models
            mountPath: /models/current
            readOnly: true
          - name: m09-source
            mountPath: /m09-source
            readOnly: true
        volumes:
        - name: models
          hostPath:
            path: /root/Qwen3-32B
            type: Directory
        - name: m09-source
          hostPath:
            path: /home/bedicloud/CJ_workspace/m09-offline-qwen32-1030/source
            type: Directory
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        runtimeClassName: nvidia
        terminationGracePeriodSeconds: 240
