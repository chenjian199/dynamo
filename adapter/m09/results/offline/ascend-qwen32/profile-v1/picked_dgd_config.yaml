          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_ROUTER_USE_KV_EVENTS
            value: 'true'
          - name: DYN_PLATFORM
            value: ascend
          - name: VLLM_HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
            value: '20090'
          - name: VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT
            value: '60'
          - name: ASCEND_TRANSFER_TIMEOUT
            value: '30000'
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: GOMAXPROCS
            value: '4'
          - name: SPT_NOENV
            value: '1'
          - name: DYN_GRACEFUL_SHUTDOWN_GRACE_PERIOD_SECS
            value: '180'
          - name: PYTHONPATH
            value: /m09-source/components/src
          resources:
            requests:
              huawei.com/Ascend910: 4
              cpu: '8'
              memory: 64Gi
            limits:
              huawei.com/Ascend910: 4
              cpu: '32'
              memory: 256Gi
          volumeMounts:
          - name: models
            mountPath: /models/current
