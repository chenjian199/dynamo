          - name: ascend-dcmi
            mountPath: /usr/local/dcmi
            readOnly: true
          - name: ascend-smi
            mountPath: /usr/local/sbin/npu-smi
            readOnly: true
          - name: m09-source
            mountPath: /m09-source
            readOnly: true
        volumes:
        - name: models
          hostPath:
            path: /data/Qwen3-32B
            type: Directory
        - name: ascend-driver
          hostPath:
            path: /usr/local/Ascend/driver
            type: Directory
        - name: ascend-dcmi
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: ascend-smi
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: m09-source
          hostPath:
            path: /root/CJ_workspace/m09-offline-qwen32-1030/source
            type: Directory
