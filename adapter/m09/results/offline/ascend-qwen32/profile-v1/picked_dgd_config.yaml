          - --max-num-seqs
          - '16'
          - --gpu-memory-utilization
          - '0.9'
          - --block-size
          - '128'
          - --disable-custom-all-reduce
          - --kv-cache-memory-bytes
          - '536870912'
          - --no-enable-prefix-caching
          - --disaggregation-mode
          - decode
          - --kv-transfer-config
          - '{"kv_connector": "MooncakeConnector", "kv_role": "kv_consumer", "kv_connector_module_path":
            "vllm_ascend.distributed.kv_transfer.kv_p2p.mooncake_connector", "kv_port":
            20090, "kv_connector_extra_config": {"prefill": {"tp_size": 4, "dp_size":
