schema_version: 1
id: M07-F03
revision: 2
name: 独立编码器传输
module: M07
owner: HEYI
dependencies:
- M03-F01
- M04-F01
- M07-F02
- M05-F02
requirements:
- ssh
- workspace
- device
- runtime
- images
- models
implementation_paths:
- components/src/dynamo/common/platform
- components/src/dynamo/vllm
- lib/gpu_memory_service
- adapter/modules/m07-gms-multimodal/common
reference:
  baseline: container/platforms/cuda.json
  rule: Compare supported behavior, not a whitelist of tested TP/DP/PP combinations; preserve vendor engine
    arguments.
scope:
  behavior: 独立编码器传输
  exclusions:
  - Unmeasured hardware/topologies and vendor-native failures are not certified by this feature.
cases:
- id: M07-F03-C01
  name: 独立编码器传输
  required_assertions:
  - behavior
  - cleanup
  - identity
  - encoder_decode_handoff
  - hidden_state_integrity
  evidence_requirements:
  - command
  - environment
  - raw_output
  - verifier
  checks:
    behavior:
    - op: positive
      path: /completed_operations
    cleanup:
    - op: equal
      path: /resources_remaining
      value: []
    identity:
    - op: equal
      path: /identity
      expected_from: /identity
    - op: equal
      path: /installed_versions
      expected_from: /stack/versions
    - op: equal
      path: /execution_image
      expected_from: /case_binding/image
    - op: equal
      path: /observed_topology
      expected_from: /case_binding/topology
    - op: equal
      path: /model_manifests
      expected_from: /model_manifests
    encoder_decode_handoff:
    - op: equal_fields
      path: /measurements/encoder_decode_handoff/actual
      other: /measurements/encoder_decode_handoff/reference
      nonempty: true
    hidden_state_integrity:
    - op: file_parity
      path: /files/producer
      other: /files/consumer
  recipe:
    entrypoints: &id001
    - adapter/modules/m07-gms-multimodal/common/media/run.py
    binding: environment.case_bindings.M07-F03-C01
    phases:
    - prepare
    - run
    - observe
    - cleanup
    - verify
    verifier: adapter/workflow/evidence/verify.py
    required_inputs:
    - nodes
    - image
    - topology
    - models
    observation: cases/M07-F03-C01/observations.json
  negative_cases:
  - missing_or_modified_measurement
  - wrong_image_or_model_identity
  - native_failure_kept_separate
  native_control: Same model revision, engine parameters, workload and topology; paired raw outputs required
    where parity is asserted.
failure_classes:
- environment
- adaptation
- native_engine
- unsupported_evidenced
- insufficient_evidence
retry:
  max_attempts: 2
  policy: Diagnose first; never hide an earlier failure.
acceptance_notes:
- Assertions require independently observed evidence, not copied constants or a generic passed flag.
- For a capability with multiple native backends, choose a supported backend in campaign scope; do not
  require every vendor to implement every transport.
entrypoints: *id001
