schema_version: 1
id: M03-F05
revision: 2
name: LoRA 量化推测解码与 MoE
module: M03
owner: HEYI
dependencies:
- M01-F01
- M02-F01
- M03-F01
requirements:
- ssh
- workspace
- device
- runtime
- images
- models
implementation_paths:
- components/src/dynamo/common/backend
- components/src/dynamo/common/platform
- components/src/dynamo/vllm
- adapter/modules/m03-engine-integration/common
reference:
  baseline: container/platforms/cuda.json
  rule: Compare supported behavior, not a whitelist of tested TP/DP/PP combinations; preserve vendor engine
    arguments.
scope:
  behavior: LoRA 量化推测解码与 MoE
  exclusions:
  - Unmeasured hardware/topologies and vendor-native failures are not certified by this feature.
cases:
- id: M03-F05-C01
  name: LoRA 加载与隔离
  required_assertions:
  - behavior
  - cleanup
  - identity
  - asset_identity
  - advanced_engine_parity
  - unsupported_native_distinguished
  evidence_requirements:
  - command
  - environment
  - raw_output
  - verifier
  checks:
    behavior:
    - op: positive
      path: /completed_operations
    cleanup:
    - op: equal
      path: /resources_remaining
      value: []
    identity:
    - op: equal
      path: /identity
      expected_from: /identity
    - op: equal
      path: /installed_versions
      expected_from: /stack/versions
    - op: equal
      path: /execution_image
      expected_from: /case_binding/image
    - op: equal
      path: /observed_topology
      expected_from: /case_binding/topology
    - op: equal
      path: /model_manifests
      expected_from: /model_manifests
    asset_identity:
    - op: equal_fields
      path: /measurements/asset_identity/actual
      other: /measurements/asset_identity/reference
      nonempty: true
    advanced_engine_parity:
    - op: equal_fields
      path: /dynamo/output_tokens
      other: /native/output_tokens
      nonempty: true
    unsupported_native_distinguished:
    - op: equal_fields
      path: /measurements/unsupported_native_distinguished/actual
      other: /measurements/unsupported_native_distinguished/reference
      nonempty: true
  recipe:
    entrypoints: &id001
    - adapter/modules/m03-engine-integration/common/engine/advanced-smoke.py
    binding: environment.case_bindings.M03-F05-C01
    phases:
    - prepare
    - run
    - observe
    - cleanup
    - verify
    verifier: adapter/workflow/evidence/verify.py
    required_inputs:
    - nodes
    - image
    - topology
    - models
    observation: cases/M03-F05-C01/observations.json
  negative_cases:
  - missing_or_modified_measurement
  - wrong_image_or_model_identity
  - native_failure_kept_separate
  native_control: Same model revision, engine parameters, workload and topology; paired raw outputs required
    where parity is asserted.
