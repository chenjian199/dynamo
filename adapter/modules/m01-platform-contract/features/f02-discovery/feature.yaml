schema_version: 1
id: M01-F02
revision: 2
name: 设备枚举与服务发现
module: M01
owner: HEYI
dependencies:
- M01-F01
requirements:
- ssh
- workspace
- device
implementation_paths:
- components/src/dynamo/common/platform
- lib/bindings/python
- lib/platform
- lib/runtime/src
- adapter/modules/m01-platform-contract/common
reference:
  baseline: container/platforms/cuda.json
  rule: Compare supported behavior, not a whitelist of tested TP/DP/PP combinations; preserve vendor engine
    arguments.
scope:
  behavior: 设备枚举与服务发现
  exclusions:
  - Unmeasured hardware/topologies and vendor-native failures are not certified by this feature.
cases:
- id: M01-F02-C01
  name: 设备枚举与服务发现
  required_assertions:
  - behavior
  - cleanup
  - identity
  - device_identity_stable
  - visible_device_filtering
  - discovery_roundtrip
  evidence_requirements:
  - command
  - environment
  - raw_output
  - verifier
  checks:
    behavior:
    - op: positive
      path: /completed_operations
    cleanup:
    - op: equal
      path: /resources_remaining
      value: []
    identity:
    - op: equal
      path: /identity
      expected_from: /identity
    - op: equal
      path: /installed_versions
      expected_from: /stack/versions
    - op: equal
      path: /execution_image
      expected_from: /case_binding/image
    - op: equal
      path: /observed_topology
      expected_from: /case_binding/topology
    - op: equal
      path: /model_manifests
      expected_from: /model_manifests
    device_identity_stable:
    - op: equal_fields
      path: /measurements/device_identity_stable/actual
      other: /measurements/device_identity_stable/reference
      nonempty: true
    visible_device_filtering:
    - op: equal_fields
      path: /measurements/visible_device_filtering/actual
      other: /measurements/visible_device_filtering/reference
      nonempty: true
    discovery_roundtrip:
    - op: equal_fields
      path: /measurements/discovery_roundtrip/actual
      other: /measurements/discovery_roundtrip/reference
      nonempty: true
  recipe:
    entrypoints: &id001
    - adapter/modules/m01-platform-contract/common/discovery/platform-smoke.py
    binding: environment.case_bindings.M01-F02-C01
    phases:
    - prepare
    - run
    - observe
    - cleanup
    - verify
    verifier: adapter/workflow/evidence/verify.py
    required_inputs:
    - nodes
    - image
    - topology
    observation: cases/M01-F02-C01/observations.json
  negative_cases:
  - missing_or_modified_measurement
  - wrong_image_or_model_identity
  - native_failure_kept_separate
  native_control: Same model revision, engine parameters, workload and topology; paired raw outputs required
    where parity is asserted.
failure_classes:
- environment
- adaptation
- native_engine
- unsupported_evidenced
- insufficient_evidence
retry:
  max_attempts: 2
  policy: Diagnose first; never hide an earlier failure.
acceptance_notes:
- Assertions require independently observed evidence, not copied constants or a generic passed flag.
- For a capability with multiple native backends, choose a supported backend in campaign scope; do not
  require every vendor to implement every transport.
entrypoints: *id001
