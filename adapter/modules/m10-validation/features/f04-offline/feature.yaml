schema_version: 1
id: M10-F04
revision: 2
name: 离线导入与封存交付
module: M10
owner: HEYI
dependencies:
- M02-F03
- M10-F01
- M10-F02
- M10-F03
- M02-F04
requirements:
- ssh
- workspace
- runtime
- images
implementation_paths:
- adapter/releases
- container/platforms
- adapter/modules/m10-validation/common
reference:
  baseline: container/platforms/cuda.json
  rule: Compare supported behavior, not a whitelist of tested TP/DP/PP combinations; preserve vendor engine
    arguments.
scope:
  behavior: 离线导入与封存交付
  exclusions:
  - Unmeasured hardware/topologies and vendor-native failures are not certified by this feature.
cases:
- id: M10-F04-C01
  name: 完整层校验
  required_assertions:
  - behavior
  - cleanup
  - identity
  - full_layers_present
  - manifest_digests
  evidence_requirements:
  - command
  - environment
  - raw_output
  - verifier
  checks:
    behavior:
    - op: positive
      path: /completed_operations
    cleanup:
    - op: equal
      path: /resources_remaining
      value: []
    identity:
    - op: equal
      path: /identity
      expected_from: /identity
    - op: equal
      path: /installed_versions
      expected_from: /stack/versions
    - op: equal
      path: /execution_image
      expected_from: /case_binding/image
    - op: equal
      path: /observed_topology
      expected_from: /case_binding/topology
    - op: equal
      path: /model_manifests
      expected_from: /model_manifests
    full_layers_present:
    - op: equal_fields
      path: /measurements/full_layers_present/actual
      other: /measurements/full_layers_present/reference
      nonempty: true
    manifest_digests:
    - op: equal_fields
      path: /measurements/manifest_digests/actual
      other: /measurements/manifest_digests/reference
      nonempty: true
  recipe:
    entrypoints: &id001
    - adapter/modules/m10-validation/common/offline/export-images.py
    - adapter/modules/m10-validation/common/offline/verify-images.py
    - adapter/modules/m10-validation/common/offline/import.sh
    - adapter/modules/m10-validation/common/offline/bundle.py
    binding: environment.case_bindings.M10-F04-C01
    phases:
    - prepare
    - run
    - observe
    - cleanup
    - verify
    verifier: adapter/workflow/evidence/verify.py
    required_inputs:
    - nodes
    - image
    - topology
    observation: cases/M10-F04-C01/observations.json
  negative_cases:
  - missing_or_modified_measurement
  - wrong_image_or_model_identity
  - native_failure_kept_separate
  native_control: Same model revision, engine parameters, workload and topology; paired raw outputs required
    where parity is asserted.
- id: M10-F04-C02
  name: 离线导入回归
  required_assertions:
  - behavior
  - cleanup
  - identity
  - offline_import
  evidence_requirements:
  - command
  - environment
  - raw_output
  - verifier
  checks:
    behavior:
    - op: positive
      path: /completed_operations
    cleanup:
    - op: equal
      path: /resources_remaining
      value: []
    identity:
    - op: equal
      path: /identity
      expected_from: /identity
    - op: equal
      path: /installed_versions
      expected_from: /stack/versions
    - op: equal
      path: /execution_image
      expected_from: /case_binding/image
    - op: equal
      path: /observed_topology
      expected_from: /case_binding/topology
    - op: equal
      path: /model_manifests
      expected_from: /model_manifests
    offline_import:
    - op: equal_fields
      path: /measurements/offline_import/actual
      other: /measurements/offline_import/reference
      nonempty: true
  recipe:
    entrypoints: *id001
    binding: environment.case_bindings.M10-F04-C02
    phases:
    - prepare
    - run
    - observe
    - cleanup
    - verify
    verifier: adapter/workflow/evidence/verify.py
    required_inputs:
    - nodes
    - image
    - topology
    observation: cases/M10-F04-C02/observations.json
  negative_cases:
  - missing_or_modified_measurement
  - wrong_image_or_model_identity
  - native_failure_kept_separate
  native_control: Same model revision, engine parameters, workload and topology; paired raw outputs required
    where parity is asserted.
- id: M10-F04-C03
  name: 最终封存
  required_assertions:
  - behavior
  - cleanup
  - identity
  - sealed_bundle_hash
  evidence_requirements:
  - command
  - environment
  - raw_output
  - verifier
  checks:
    behavior:
    - op: positive
      path: /completed_operations
    cleanup:
    - op: equal
      path: /resources_remaining
      value: []
    identity:
    - op: equal
      path: /identity
      expected_from: /identity
    - op: equal
      path: /installed_versions
      expected_from: /stack/versions
    - op: equal
      path: /execution_image
      expected_from: /case_binding/image
    - op: equal
      path: /observed_topology
      expected_from: /case_binding/topology
    - op: equal
      path: /model_manifests
      expected_from: /model_manifests
    sealed_bundle_hash:
    - op: equal_fields
      path: /measurements/sealed_bundle_hash/actual
      other: /measurements/sealed_bundle_hash/reference
      nonempty: true
  recipe:
    entrypoints: *id001
    binding: environment.case_bindings.M10-F04-C03
    phases:
    - prepare
    - run
    - observe
    - cleanup
    - verify
    verifier: adapter/workflow/evidence/verify.py
    required_inputs:
    - nodes
    - image
    - topology
    observation: cases/M10-F04-C03/observations.json
  negative_cases:
  - missing_or_modified_measurement
  - wrong_image_or_model_identity
  - native_failure_kept_separate
  native_control: Same model revision, engine parameters, workload and topology; paired raw outputs required
    where parity is asserted.
failure_classes:
- environment
- adaptation
- native_engine
- unsupported_evidenced
- insufficient_evidence
retry:
  max_attempts: 2
  policy: Diagnose first; never hide an earlier failure.
acceptance_notes:
- Assertions require independently observed evidence, not copied constants or a generic passed flag.
- For a capability with multiple native backends, choose a supported backend in campaign scope; do not
  require every vendor to implement every transport.
entrypoints: *id001
