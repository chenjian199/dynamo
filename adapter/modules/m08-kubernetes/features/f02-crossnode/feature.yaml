schema_version: 1
id: M08-F02
revision: 2
name: Operator 跨节点 PD
module: M08
owner: HEYI
dependencies:
- M01-F02
- M02-F03
- M08-F01
- M05-F05
requirements:
- ssh
- workspace
- device
- runtime
- images
- kubernetes
- multinode
- network
implementation_paths:
- components/src/dynamo/profiler/utils
- deploy/helm
- deploy/operator
- adapter/modules/m08-kubernetes/common
reference:
  baseline: container/platforms/cuda.json
  rule: Compare supported behavior, not a whitelist of tested TP/DP/PP combinations; preserve vendor engine
    arguments.
scope:
  behavior: Operator 跨节点 PD
  exclusions:
  - Unmeasured hardware/topologies and vendor-native failures are not certified by this feature.
cases:
- id: M08-F02-C01
  name: Operator 跨节点 PD
  required_assertions:
  - behavior
  - cleanup
  - identity
  - operator_crossnode_pd
  - placement_verified
  evidence_requirements:
  - command
  - environment
  - raw_output
  - verifier
  checks:
    behavior:
    - op: positive
      path: /completed_operations
    cleanup:
    - op: equal
      path: /resources_remaining
      value: []
    identity:
    - op: equal
      path: /identity
      expected_from: /identity
    - op: equal
      path: /installed_versions
      expected_from: /stack/versions
    - op: equal
      path: /execution_image
      expected_from: /case_binding/image
    - op: equal
      path: /observed_topology
      expected_from: /case_binding/topology
    - op: equal
      path: /model_manifests
      expected_from: /model_manifests
    operator_crossnode_pd:
    - op: equal_fields
      path: /measurements/operator_crossnode_pd/actual
      other: /measurements/operator_crossnode_pd/reference
      nonempty: true
    placement_verified:
    - op: equal_fields
      path: /measurements/placement_verified/actual
      other: /measurements/placement_verified/reference
      nonempty: true
  recipe:
    entrypoints: &id001
    - adapter/modules/m08-kubernetes/common/cluster/cross.py
    binding: environment.case_bindings.M08-F02-C01
    phases:
    - prepare
    - run
    - observe
    - cleanup
    - verify
    verifier: adapter/workflow/evidence/verify.py
    required_inputs:
    - nodes
    - image
    - topology
    observation: cases/M08-F02-C01/observations.json
  negative_cases:
  - missing_or_modified_measurement
  - wrong_image_or_model_identity
  - native_failure_kept_separate
  native_control: Same model revision, engine parameters, workload and topology; paired raw outputs required
    where parity is asserted.
failure_classes:
- environment
- adaptation
- native_engine
- unsupported_evidenced
- insufficient_evidence
retry:
  max_attempts: 2
  policy: Diagnose first; never hide an earlier failure.
acceptance_notes:
- Assertions require independently observed evidence, not copied constants or a generic passed flag.
- For a capability with multiple native backends, choose a supported backend in campaign scope; do not
  require every vendor to implement every transport.
entrypoints: *id001
