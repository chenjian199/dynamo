# Values for the standalone dynamo-operator chart, not the platform umbrella.
discoveryBackend: kubernetes
upgradeCRD: true
namespaceRestriction:
  enabled: false
global:
  grove:
    enabled: false
    install: false
  kai-scheduler:
    enabled: false
    install: false
  volcano-scheduler:
    enabled: false
  nats:
    install: false
  etcd:
    install: false
controllerManager:
  replicas: 1
  manager:
    image:
      repository: heyi/dynamo-operator
      tag: 1.5.1-m08-amd64
      pullPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: [amd64]
              - key: kubernetes.io/os
                operator: In
                values: [linux]
metricsService:
  enabled: false
dynamo:
  metrics:
    podMonitors:
      enabled: false
webhook:
  certificateSecret:
    external: false
  certManager:
    enabled: false
