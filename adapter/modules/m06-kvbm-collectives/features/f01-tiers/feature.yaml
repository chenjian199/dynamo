schema_version: 1
id: M06-F01
revision: 2
name: G2 G3 缓存卸载命中及路由
module: M06
owner: HEYI
dependencies:
- M03-F01
- M04-F01
- M04-F02
requirements:
- ssh
- workspace
- device
- runtime
- images
- models
implementation_paths:
- lib/bindings/kvbm
- lib/kvbm-engine
- lib/kvbm-kernels
- lib/kvbm-logical
- lib/kvbm-physical
- lib/llm/src/block_manager
- lib/platform-runtime
- adapter/modules/m06-kvbm-collectives/common
reference:
  baseline: container/platforms/cuda.json
  rule: Compare supported behavior, not a whitelist of tested TP/DP/PP combinations; preserve vendor engine
    arguments.
scope:
  behavior: G2 G3 缓存卸载命中及路由
  exclusions:
  - Unmeasured hardware/topologies and vendor-native failures are not certified by this feature.
cases:
- id: M06-F01-C01
  name: G2 主机命中
  required_assertions:
  - behavior
  - cleanup
  - identity
  - host_hit
  - output_parity
  evidence_requirements:
  - command
  - environment
  - raw_output
  - verifier
  checks:
    behavior:
    - op: positive
      path: /completed_operations
    cleanup:
    - op: equal
      path: /resources_remaining
      value: []
    identity:
    - op: equal
      path: /identity
      expected_from: /identity
    - op: equal
      path: /installed_versions
      expected_from: /stack/versions
    - op: equal
      path: /execution_image
      expected_from: /case_binding/image
    - op: equal
      path: /observed_topology
      expected_from: /case_binding/topology
    - op: equal
      path: /model_manifests
      expected_from: /model_manifests
    host_hit:
    - op: positive
      path: /metrics/host_hit_count
    output_parity:
    - op: equal_fields
      path: /dynamo/output_tokens
      other: /native/output_tokens
      nonempty: true
  recipe:
    entrypoints: &id001
    - adapter/modules/m06-kvbm-collectives/common/cache/run.py
    - adapter/modules/m06-kvbm-collectives/common/cache/routing.py
    binding: environment.case_bindings.M06-F01-C01
    phases:
    - prepare
    - run
    - observe
    - cleanup
    - verify
    verifier: adapter/workflow/evidence/verify.py
    required_inputs:
    - nodes
    - image
    - topology
    - models
    observation: cases/M06-F01-C01/observations.json
  negative_cases:
  - missing_or_modified_measurement
  - wrong_image_or_model_identity
  - native_failure_kept_separate
  native_control: Same model revision, engine parameters, workload and topology; paired raw outputs required
    where parity is asserted.
