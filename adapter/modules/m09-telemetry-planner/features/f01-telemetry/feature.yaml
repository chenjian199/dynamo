schema_version: 1
id: M09-F01
revision: 2
name: 指标与资源观测
module: M09
owner: HEYI
dependencies:
- M08-F01
- M03-F01
requirements:
- ssh
- workspace
- device
- runtime
- images
- kubernetes
implementation_paths:
- components/src/dynamo/common/config_dump
- components/src/dynamo/common/platform
- components/src/dynamo/planner
- components/src/dynamo/profiler
- adapter/modules/m09-telemetry-planner/common
reference:
  baseline: container/platforms/cuda.json
  rule: Compare supported behavior, not a whitelist of tested TP/DP/PP combinations; preserve vendor engine
    arguments.
scope:
  behavior: 指标与资源观测
  exclusions:
  - Unmeasured hardware/topologies and vendor-native failures are not certified by this feature.
cases:
- id: M09-F01-C01
  name: 指标与资源观测
  required_assertions:
  - behavior
  - cleanup
  - identity
  - device_metrics
  - resource_mapping
  - series_labels
  evidence_requirements:
  - command
  - environment
  - raw_output
  - verifier
  checks:
    behavior:
    - op: positive
      path: /completed_operations
    cleanup:
    - op: equal
      path: /resources_remaining
      value: []
    identity:
    - op: equal
      path: /identity
      expected_from: /identity
    - op: equal
      path: /installed_versions
      expected_from: /stack/versions
    - op: equal
      path: /execution_image
      expected_from: /case_binding/image
    - op: equal
      path: /observed_topology
      expected_from: /case_binding/topology
    - op: equal
      path: /model_manifests
      expected_from: /model_manifests
    device_metrics:
    - op: equal_fields
      path: /measurements/device_metrics/actual
      other: /measurements/device_metrics/reference
      nonempty: true
    resource_mapping:
    - op: equal_fields
      path: /measurements/resource_mapping/actual
      other: /measurements/resource_mapping/reference
      nonempty: true
    series_labels:
    - op: equal_fields
      path: /measurements/series_labels/actual
      other: /measurements/series_labels/reference
      nonempty: true
  recipe:
    entrypoints: &id001
    - adapter/modules/m09-telemetry-planner/common/rendering/render_metrics.py
    - adapter/modules/m09-telemetry-planner/common/online/collect.py
    binding: environment.case_bindings.M09-F01-C01
    phases:
    - prepare
    - run
    - observe
    - cleanup
    - verify
    verifier: adapter/workflow/evidence/verify.py
    required_inputs:
    - nodes
    - image
    - topology
    observation: cases/M09-F01-C01/observations.json
  negative_cases:
  - missing_or_modified_measurement
  - wrong_image_or_model_identity
  - native_failure_kept_separate
  native_control: Same model revision, engine parameters, workload and topology; paired raw outputs required
    where parity is asserted.
failure_classes:
- environment
- adaptation
- native_engine
- unsupported_evidenced
- insufficient_evidence
retry:
  max_attempts: 2
  policy: Diagnose first; never hide an earlier failure.
acceptance_notes:
- Assertions require independently observed evidence, not copied constants or a generic passed flag.
- For a capability with multiple native backends, choose a supported backend in campaign scope; do not
  require every vendor to implement every transport.
entrypoints: *id001
