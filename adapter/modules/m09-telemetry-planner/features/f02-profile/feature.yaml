schema_version: 1
id: M09-F02
revision: 2
name: 离线采样插值及画像身份
module: M09
owner: HEYI
dependencies:
- M08-F01
- M03-F01
- M09-F01
requirements:
- ssh
- workspace
- device
- runtime
- images
- models
- kubernetes
implementation_paths:
- components/src/dynamo/common/config_dump
- components/src/dynamo/common/platform
- components/src/dynamo/planner
- components/src/dynamo/profiler
- adapter/modules/m09-telemetry-planner/common
reference:
  baseline: container/platforms/cuda.json
  rule: Compare supported behavior, not a whitelist of tested TP/DP/PP combinations; preserve vendor engine
    arguments.
scope:
  behavior: 离线采样插值及画像身份
  exclusions:
  - Unmeasured hardware/topologies and vendor-native failures are not certified by this feature.
cases:
- id: M09-F02-C01
  name: 真实离线采样
  required_assertions:
  - behavior
  - cleanup
  - identity
  - profile_identity
  - real_sampling
  evidence_requirements:
  - command
  - environment
  - raw_output
  - verifier
  checks:
    behavior:
    - op: positive
      path: /completed_operations
    cleanup:
    - op: equal
      path: /resources_remaining
      value: []
    identity:
    - op: equal
      path: /identity
      expected_from: /identity
    - op: equal
      path: /installed_versions
      expected_from: /stack/versions
    - op: equal
      path: /execution_image
      expected_from: /case_binding/image
    - op: equal
      path: /observed_topology
      expected_from: /case_binding/topology
    - op: equal
      path: /model_manifests
      expected_from: /model_manifests
    profile_identity:
    - op: equal_fields
      path: /measurements/profile_identity/actual
      other: /measurements/profile_identity/reference
      nonempty: true
    real_sampling:
    - op: positive
      path: /metrics/measured_profile_samples
  recipe:
    entrypoints: &id001
    - adapter/modules/m09-telemetry-planner/common/offline/offline_profile.py
    - adapter/modules/m09-telemetry-planner/common/evidence/check_offline_profile.py
    - adapter/modules/m09-telemetry-planner/common/evidence/check_profile_exports.py
    binding: environment.case_bindings.M09-F02-C01
    phases:
    - prepare
    - run
    - observe
    - cleanup
    - verify
    verifier: adapter/workflow/evidence/verify.py
    required_inputs:
    - nodes
    - image
    - topology
    - models
    observation: cases/M09-F02-C01/observations.json
  negative_cases:
  - missing_or_modified_measurement
  - wrong_image_or_model_identity
  - native_failure_kept_separate
  native_control: Same model revision, engine parameters, workload and topology; paired raw outputs required
    where parity is asserted.
- id: M09-F02-C02
  name: 插值及边界
  required_assertions:
  - behavior
  - cleanup
  - identity
  - interpolation_bounds
  evidence_requirements:
  - command
  - environment
  - raw_output
  - verifier
  checks:
    behavior:
    - op: positive
      path: /completed_operations
    cleanup:
    - op: equal
      path: /resources_remaining
      value: []
    identity:
    - op: equal
      path: /identity
      expected_from: /identity
    - op: equal
      path: /installed_versions
      expected_from: /stack/versions
    - op: equal
      path: /execution_image
      expected_from: /case_binding/image
    - op: equal
      path: /observed_topology
      expected_from: /case_binding/topology
    - op: equal
      path: /model_manifests
      expected_from: /model_manifests
    interpolation_bounds:
    - op: positive
      path: /metrics/rejected_out_of_bounds_samples
  recipe:
    entrypoints: *id001
    binding: environment.case_bindings.M09-F02-C02
    phases:
    - prepare
    - run
    - observe
    - cleanup
    - verify
    verifier: adapter/workflow/evidence/verify.py
    required_inputs:
    - nodes
    - image
    - topology
    - models
    observation: cases/M09-F02-C02/observations.json
  negative_cases:
  - missing_or_modified_measurement
  - wrong_image_or_model_identity
  - native_failure_kept_separate
  native_control: Same model revision, engine parameters, workload and topology; paired raw outputs required
    where parity is asserted.
- id: M09-F02-C03
  name: 画像复用与拒绝错配
  required_assertions:
  - behavior
  - cleanup
  - identity
  - reuse_checks
  evidence_requirements:
  - command
  - environment
  - raw_output
  - verifier
  checks:
    behavior:
    - op: positive
      path: /completed_operations
    cleanup:
    - op: equal
      path: /resources_remaining
      value: []
    identity:
    - op: equal
      path: /identity
      expected_from: /identity
    - op: equal
      path: /installed_versions
      expected_from: /stack/versions
    - op: equal
      path: /execution_image
      expected_from: /case_binding/image
    - op: equal
      path: /observed_topology
      expected_from: /case_binding/topology
    - op: equal
      path: /model_manifests
      expected_from: /model_manifests
    reuse_checks:
    - op: positive
      path: /metrics/rejected_mismatched_profiles
  recipe:
    entrypoints: *id001
    binding: environment.case_bindings.M09-F02-C03
    phases:
    - prepare
    - run
    - observe
    - cleanup
    - verify
    verifier: adapter/workflow/evidence/verify.py
    required_inputs:
    - nodes
    - image
    - topology
    - models
    observation: cases/M09-F02-C03/observations.json
  negative_cases:
  - missing_or_modified_measurement
  - wrong_image_or_model_identity
  - native_failure_kept_separate
  native_control: Same model revision, engine parameters, workload and topology; paired raw outputs required
    where parity is asserted.
failure_classes:
- environment
- adaptation
- native_engine
- unsupported_evidenced
- insufficient_evidence
retry:
  max_attempts: 2
  policy: Diagnose first; never hide an earlier failure.
acceptance_notes:
- Assertions require independently observed evidence, not copied constants or a generic passed flag.
- For a capability with multiple native backends, choose a supported backend in campaign scope; do not
  require every vendor to implement every transport.
entrypoints: *id001
