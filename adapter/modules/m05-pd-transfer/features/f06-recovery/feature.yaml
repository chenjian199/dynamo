schema_version: 1
id: M05-F06
revision: 2
name: 故障取消回收长稳
module: M05
owner: HEYI
dependencies:
- M03-F01
- M04-F01
- M05-F02
requirements:
- ssh
- workspace
- device
- runtime
- images
- models
implementation_paths:
- components/src/dynamo/common/platform
- components/src/dynamo/vllm
- components/src/dynamo/vllm/kv_connector_protocols.py
- components/src/dynamo/vllm/pd_contract.py
- adapter/modules/m05-pd-transfer/common
reference:
  baseline: container/platforms/cuda.json
  rule: Compare supported behavior, not a whitelist of tested TP/DP/PP combinations; preserve vendor engine
    arguments.
scope:
  behavior: 故障取消回收长稳
  exclusions:
  - Unmeasured hardware/topologies and vendor-native failures are not certified by this feature.
cases:
- id: M05-F06-C01
  name: 取消恢复
  required_assertions:
  - behavior
  - cleanup
  - identity
  - cancel_recovers
  evidence_requirements:
  - command
  - environment
  - raw_output
  - verifier
  checks:
    behavior:
    - op: positive
      path: /completed_operations
    cleanup:
    - op: equal
      path: /resources_remaining
      value: []
    identity:
    - op: equal
      path: /identity
      expected_from: /identity
    - op: equal
      path: /installed_versions
      expected_from: /stack/versions
    - op: equal
      path: /execution_image
      expected_from: /case_binding/image
    - op: equal
      path: /observed_topology
      expected_from: /case_binding/topology
    - op: equal
      path: /model_manifests
      expected_from: /model_manifests
    cancel_recovers:
    - op: equal_fields
      path: /measurements/cancel_recovers/actual
      other: /measurements/cancel_recovers/reference
      nonempty: true
  recipe:
    entrypoints: &id001
    - adapter/modules/m05-pd-transfer/common/transfer/inflight_probe.py
    - adapter/modules/m05-pd-transfer/common/transfer/soak.py
    binding: environment.case_bindings.M05-F06-C01
    phases:
    - prepare
    - run
    - observe
    - cleanup
    - verify
    verifier: adapter/workflow/evidence/verify.py
    required_inputs:
    - nodes
    - image
    - topology
    - models
    observation: cases/M05-F06-C01/observations.json
  negative_cases:
  - missing_or_modified_measurement
  - wrong_image_or_model_identity
  - native_failure_kept_separate
  native_control: Same model revision, engine parameters, workload and topology; paired raw outputs required
    where parity is asserted.
