schema_version: 1
id: M05-F04
revision: 2
name: 异宽 TP 与秩映射
module: M05
owner: HEYI
dependencies:
- M03-F01
- M04-F01
- M05-F02
requirements:
- ssh
- workspace
- device
- runtime
- images
- models
implementation_paths:
- components/src/dynamo/common/platform
- components/src/dynamo/vllm
- components/src/dynamo/vllm/kv_connector_protocols.py
- components/src/dynamo/vllm/pd_contract.py
- adapter/modules/m05-pd-transfer/common
reference:
  baseline: container/platforms/cuda.json
  rule: Compare supported behavior, not a whitelist of tested TP/DP/PP combinations; preserve vendor engine
    arguments.
scope:
  behavior: 异宽 TP 与秩映射
  exclusions:
  - Unmeasured hardware/topologies and vendor-native failures are not certified by this feature.
cases:
- id: M05-F04-C01
  name: 异宽 TP 与秩映射
  required_assertions:
  - behavior
  - cleanup
  - identity
  - unequal_tp_native_contract
  - rank_mapping
  evidence_requirements:
  - command
  - environment
  - raw_output
  - verifier
  checks:
    behavior:
    - op: positive
      path: /completed_operations
    cleanup:
    - op: equal
      path: /resources_remaining
      value: []
    identity:
    - op: equal
      path: /identity
      expected_from: /identity
    - op: equal
      path: /installed_versions
      expected_from: /stack/versions
    - op: equal
      path: /execution_image
      expected_from: /case_binding/image
    - op: equal
      path: /observed_topology
      expected_from: /case_binding/topology
    - op: equal
      path: /model_manifests
      expected_from: /model_manifests
    unequal_tp_native_contract:
    - op: equal_fields
      path: /measurements/unequal_tp_native_contract/actual
      other: /measurements/unequal_tp_native_contract/reference
      nonempty: true
    rank_mapping:
    - op: equal_fields
      path: /measurements/rank_mapping/actual
      other: /measurements/rank_mapping/reference
      nonempty: true
  recipe:
    entrypoints: &id001
    - adapter/modules/m05-pd-transfer/common/transfer/topology.py
    binding: environment.case_bindings.M05-F04-C01
    phases:
    - prepare
    - run
    - observe
    - cleanup
    - verify
    verifier: adapter/workflow/evidence/verify.py
    required_inputs:
    - nodes
    - image
    - topology
    - models
    observation: cases/M05-F04-C01/observations.json
  negative_cases:
  - missing_or_modified_measurement
  - wrong_image_or_model_identity
  - native_failure_kept_separate
  native_control: Same model revision, engine parameters, workload and topology; paired raw outputs required
    where parity is asserted.
failure_classes:
- environment
- adaptation
- native_engine
- unsupported_evidenced
- insufficient_evidence
retry:
  max_attempts: 2
  policy: Diagnose first; never hide an earlier failure.
acceptance_notes:
- Assertions require independently observed evidence, not copied constants or a generic passed flag.
- For a capability with multiple native backends, choose a supported backend in campaign scope; do not
  require every vendor to implement every transport.
entrypoints: *id001
