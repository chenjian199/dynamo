- M01-F02
- M02-F01
- M03-F01
- M10-F01
- M10-F02
- M10-F03
- M10-F04
checks:
- - git
  - diff
  - --check
  - HEAD^
  - HEAD
- - python3
  - -m
  - pytest
  - -c
  - adapter/workflow/tests/pytest.ini
  - -q
  - adapter/workflow/tests
- - python3
  - adapter/tools/check-workflow.py
  - --require-ready
- - python3
  - scripts/validate_skills.py
check_timeout_seconds: 600
comparison_limits:
  min_throughput_ratio: 0.9
  max_latency_ratio: 1.1
