# Upgrade intent only. Do not use this as a qualified container/platforms stack lock.
schema_version: 1
id: dynamo-1.6.2
upstream_url: https://github.com/ai-dynamo/dynamo.git
refs:
  base: v1.5.1
  heyi: HEAD
  target: v1.6.2
target_commit: 28f9765d98ded77149a94d0defee6d54e97f6741
platforms:
  cuda:
    architecture: amd64
    vllm: 0.31.0
    repository: nvcr.io/nvidia/ai-dynamo/vllm-runtime
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.2
    python: python3
    sources:
      - https://github.com/ai-dynamo/dynamo/releases/tag/v1.6.2
      - https://catalog.ngc.nvidia.com/orgs/nvidia/ai-dynamo/containers/vllm-runtime/1.6.2
  ascend:
    architecture: arm64
    vllm: 0.30.0
    repository: quay.io/ascend/vllm-ascend
    image: quay.io/ascend/vllm-ascend:v0.30.0
    python: python3
    plugin: vllm-ascend
    sources:
      - https://docs.vllm.ai/projects/ascend/en/v0.30.0/getting_started/installation.html
      - https://github.com/vllm-project/vllm-ascend/releases/tag/v0.30.0
  metax:
    architecture: amd64
    vllm: 0.28.0
    repository: cr.metax-tech.com/public-ai-release/maca/vllm-metax
    image: cr.metax-tech.com/public-ai-release/maca/vllm-metax:0.28.0-maca.ai3.8.2.401-torch2.10-py310-ubuntu22.04-amd64
    python: /opt/conda/bin/python
    plugin: vllm-metax
    sources:
      - https://vllm-metax.readthedocs.io/en/v0.28.0/release/common/index.html
      - https://vllm-metax.readthedocs.io/en/v0.28.0/release/0.28.0/en.html
mandatory_features: [M01-F01, M01-F02, M02-F01, M03-F01, M10-F01, M10-F02, M10-F03, M10-F04]
checks:
  - [git, diff, --check, HEAD^, HEAD]
  - [python3, -m, pytest, -c, adapter/workflow/tests/pytest.ini, -q, adapter/workflow/tests]
  - [python3, adapter/tools/check-workflow.py, --require-ready]
  - [python3, scripts/validate_skills.py]
check_timeout_seconds: 600
# Initial regression budgets, not a production SLA or promised improvement.
# Freeze any site-specific changes before init. Feature/case SLA gates still apply.
comparison_limits:
  min_throughput_ratio: 0.90
  max_latency_ratio: 1.10
